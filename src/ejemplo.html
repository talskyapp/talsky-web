<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalSky Premium</title>
    <style>
        :root {
            --bg-app: #0b0f19;
            --surface: #171d2c;
            --primary: #4f46e5;
            --accent: #06b6d4;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --grad-premium: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-title);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        /* Indicador de barra superior típico de una hoja modal en Flutter (BottomSheet) */
        .pill-indicator {
            width: 40px;
            height: 5px;
            background-color: #334155;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            max-width: 320px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-body);
            font-size: 14px;
            line-height: 1.4;
        }

        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 350px;
        }

        /* Estilo base tipo Flutter Card */
        .flutter-card {
            background-color: var(--surface);
            border-radius: 28px;
            /* Bordes muy redondeados característicos */
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        /* Efecto de presión elástica (Bounce) al tocarlo en el móvil */
        .flutter-card:active {
            transform: scale(0.96);
        }

        /* Plan Destacado (Anual con Gradiente de Flutter) */
        .flutter-card.featured {
            background: var(--grad-premium);
            border: none;
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.4);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .plan-badge {
            align-self: flex-start;
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .featured .plan-badge {
            background-color: #ffffff;
            color: var(--primary);
        }

        .plan-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .plan-subtitle {
            font-size: 12px;
            color: var(--text-body);
        }

        .featured .plan-subtitle {
            color: rgba(255, 255, 255, 0.8);
        }

        .card-price-action {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .price-wrapper {
            text-align: right;
        }

        .price {
            font-size: 22px;
            font-weight: 800;
        }

        .period {
            font-size: 12px;
            color: var(--text-body);
        }

        .featured .period {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Botón estilo 'FloatingActionButton' o icono de acción minimalista */
        .action-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
        }

        .featured .action-icon {
            background-color: #ffffff;
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-body);
            text-align: center;
            max-width: 260px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="pill-indicator"></div>

    <div class="header">
        <h1>Únete a TalSky</h1>
        <p>Selecciona el plan que mejor se adapte a tu ritmo.</p>
    </div>

    <div class="plans-list">

        <div class="flutter-card">
            <div class="card-info">
                <div class="plan-title">Mensual</div>
                <div class="plan-subtitle">Acceso total inmediato</div>
            </div>
            <div class="card-price-action">
                <div class="price-wrapper">
                    <span class="price">$4.99</span>
                    <span class="period">/mes</span>
                </div>
                <div class="action-icon">→</div>
            </div>
        </div>

        <div class="flutter-card featured">
            <div class="card-info">
                <div class="plan-badge">Popular</div>
                <div class="plan-title">Plan Anual</div>
                <div class="plan-subtitle">Ahorras un 40% al año</div>
            </div>
            <div class="card-price-action">
                <div class="price-wrapper">
                    <span class="price">$2.99</span>
                    <span class="period">/mes</span>
                </div>
                <div class="action-icon">✓</div>
            </div>
        </div>

        <div class="flutter-card">
            <div class="card-info">
                <div class="plan-title">6 Meses</div>
                <div class="plan-subtitle">Pago semestral cómodo</div>
            </div>
            <div class="card-price-action">
                <div class="price-wrapper">
                    <span class="price">$3.99</span>
                    <span class="period">/mes</span>
                </div>
                <div class="action-icon">→</div>
            </div>
        </div>

    </div>

    <div class="footer">
        Restaurar compras anteriores
    </div>

</body>

</html>
